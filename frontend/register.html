<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – QRKey</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header style="justify-content: center;">
        <h1 id="logo">QRKey</h1>
    </header>

    <main>
        <div class="auth-container">
            <h2>Register</h2>
            <p style="text-align: center;">Create a new account.</p>

            <form id="registerForm">
              <label for="username">Username:</label><br>
              <input type="text" id="username" name="username" required><br><br>

              <label for="first_name">First Name:</label><br>
              <input type="text" id="first_name" name="first_name" required><br><br>

              <label for="last_name">Last Name:</label><br>
              <input type="text" id="last_name" name="last_name" required><br><br>

              <label for="email">Email:</label><br>
              <input type="email" id="email" name="email" required><br><br>

              <label for="email_confirm">Confirm Email:</label><br>
              <input type="email" id="email_confirm" name="email_confirm" required><br><br>

              <label for="password">Password:</label><br>
              <input type="password" id="password" name="password" required><br><br>

              <label for="confirm">Confirm Password:</label><br>
              <input type="password" id="confirm" name="confirm" required><br><br>

              <button type="submit">Register</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem;">Already have an account? <a href="#" id="loginLink">Login here</a></p>
        </div>
    </main>
    <script src="/static/register.js"></script>
    <script src="/static/script.js"></script>
    <script>
        const loginLink = document.getElementById("loginLink");

        loginLink.addEventListener("click", (e) => {
            e.preventDefault();
            window.location.href = "/login";
        });
    </script>
</body>
</html>
