<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Item – QRKeyF / Lock 2.0</title>
  <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header>
      <h1 id="logo">QRKey</h1>
      <nav>
        <a href="/profile">Dashboard</a>
    </nav>
    </header>

  <main>
    <div class="form-card">
      <h2>Add Item</h2>
      <p style="text-align: center; margin-bottom: 2rem;">Fill in the details for your item here.</p>

      <form  id="addItemForm">
        <label for="item_description ">Item Name:</label><br>
        <input type="item_description" id="item_description" name="item_description" required><br>

        <label for="directions">Directions if Found:</label><br>
        <textarea id="directions" name="directions" rows="4"></textarea><br>

        <label for="dropoff_location">Preferred Dropoff Location:</label><br>
        <input type="dropoff_location" id="dropoff_location" name="dropoff_location"><br>

        <label for="contact">Contact info (optional):</label><br>
        <input type="contact" id="contact" name="contact"><br>

        <button id="submit" type="submit">Add item and Generate QR code</button>
      </form>
    </div>
  </main>
  <script src="/static/script.js"></script>
  <script src="/static/additem.js"></script>
</body>
</html>
