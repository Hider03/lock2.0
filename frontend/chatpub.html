<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Item Found – QRKey</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        main {
            display: flex;
            flex-direction: column;
            height: calc(80vh - 80px);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #333333;
            border-radius: 8px;
            overflow: hidden;/
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #333333;
            overflow: hidden;
            /* Keeps the rounded corners but allows .messages to scroll */
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #2c2c2c;
            padding: 25px 30px;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .chat-header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .chat-header a:hover {
            color: #d60000;

        }

        .chat-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .chat-placeholder {
            width: 90px;
            /* balances the left link so the title stays centered */
        }


        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Individual message container */
        .message {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 1rem;
        }

        /* Timestamp styling */
        .timestamp {
            color: #888;
            font-size: 0.85rem;
            min-width: 65px;
            /* Keeps timestamps aligned vertically */
            text-align: right;
        }

        /* Sender and message colors */
        .sender {
            font-weight: bold;
        }

        .message.you .sender {
            color: #d60000;
            /* Red for You */
        }

        .message.owner .sender {
            color: #ffffff;
            /* White for Owner */
        }

        /* Optional: message text color and spacing */
        .text {
            color: #e0e0e0;
            word-wrap: break-word;
        }

        .chat-input-container {
            display: flex;
            align-items: center;
            background-color: #2c2c2c;
            border-top: 1px solid #444;
            padding: 10px 15px;
            gap: 10px;
            box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.3);
        }


        #chatInput {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid #555;
            border-radius: 20px;
            padding: 10px 15px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        #chatInput::placeholder {
            color: #aaa;
        }

        #chatInput:focus {
            border-color: #d60000;
            box-shadow: 0 0 5px rgba(214, 0, 0, 0.6);
        }

        #sendButton {
            background-color: #d60000;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #sendButton:hover {
            background-color: #c00d00;
            transform: translateY(-1px);
        }

        #sendButton:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <header style="justify-content: center;">
        <h1 id="logo">QRKey</h1>
    </header>

    <main>
        <section class="chat-container">

            <div class="chat-header">
                <a id="item_info_page" class="item_info_page">← Back to item</a>

                <div class="chat-placeholder"></div>
            </div>


            <div id="chatWindow" class="chat-window">
                <div id="messages" class="messages">
                </div>
            </div>

            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off" />
                <button id="sendButton">Send</button>
            </div>


        </section>
    </main>

    <script src="/static/script.js"></script>
    <script src="/static/chat.js"></script>
</body>

</html>
